[package]
name = "eventslog-local"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "eventslog-local"
path = "src/main.rs"

[lib]
name = "eventslog_local"
path = "src/lib.rs"

[dependencies]
eventslog-protocol = { path = "../../crates/protocol" }
eventslog-schema = { path = "../../crates/schema" }
eventslog-config = { path = "../../crates/config" }
eventslog-common = { path = "../../crates/common" }
eventslog-query = { path = "../query" }

rusqlite = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
reqwest = { workspace = true }
